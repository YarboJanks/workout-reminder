name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: pyinstaller workout_reminder.spec --noconfirm

      - name: Package .app (zip -y preserves permissions/symlinks)
        run: |
          cd dist
          zip -r -y "Workout Reminder-mac.zip" "Workout Reminder.app"

      - uses: actions/upload-artifact@v4
        with:
          name: Workout Reminder-mac
          path: dist/Workout Reminder-mac.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .exe
        run: pyinstaller --onefile --windowed --name "Workout Reminder" workout_reminder.py

      - uses: actions/upload-artifact@v4
        with:
          name: Workout Reminder-windows
          path: dist/Workout Reminder.exe

  release:
    needs: [build-mac, build-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Workout Reminder-mac
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: Workout Reminder-windows
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            artifacts/"Workout Reminder-mac.zip" \
            artifacts/"Workout Reminder.exe" \
            --title "${{ github.ref_name }}" \
            --notes "Automated build for ${{ github.ref_name }}."
